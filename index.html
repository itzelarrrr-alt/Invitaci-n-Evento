<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Aurea Guadalupe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d63384;
            font-size: 2.3rem;
            margin-bottom: 5px;
        }
        .nickname {
            font-size: 1.5rem;
            color: #e83e8c;
            margin-bottom: 10px;
            font-weight: 600;
        }
        h2 {
            color: #555;
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .info-box {
            background: #fff3f8;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 5px solid #d63384;
            text-align: left;
        }
        .info-box p {
            margin: 10px 0;
            font-size: 1.05rem;
        }
        .btn-map {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-map:hover {
            background-color: #b0236c;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .time-block {
            background: #d63384;
            color: white;
            padding: 15px;
            border-radius: 10px;
            min-width: 60px;
        }
        .time-block span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aurea Guadalupe</h1>
        <div class="nickname">"Chuyita"</div>
        <h2>¡Te invitamos a su gran fiesta sorpresa de 70 años!</h2>

        <div class="info-box">
            <p><strong>📅 Fecha:</strong> 27 de Septiembre</p>
            <p><strong>⏰ Hora:</strong> 10:15 AM</p>
            <p><strong>📍 Lugar:</strong> Hotel La Plaza de TXQ</p>
            <div style="text-align: center; margin-top: 15px;">
                <a href="https://maps.app.goo.gl/XSxNDKKDgT9BoGg16" target="_blank" class="btn-map">Abrir Ubicación en Maps</a>
            </div>
        </div>

        <div class="countdown">
            <div class="time-block"><span id="days">0</span>Días</div>
            <div class="time-block"><span id="hours">0</span>Horas</div>
            <div class="time-block"><span id="minutes">0</span>Min</div>
            <div class="time-block"><span id="seconds">0</span>Seg</div>
        </div>

        <h3>Galería de Recuerdos</h3>
        <div class="gallery">
            <img src="https://github.com/itzelarrrr-alt/Invitaci-n-Evento/blob/main/IMG_20210416_225608566.jpg?raw=true" alt="Foto 1">
            <img src="https://github.com/itzelarrrr-alt/Invitaci-n-Evento/blob/main/ae5687db-9949-466f-bca0-f6dd78395ade.jpg?raw=true" alt="Foto 2">
            <img src="https://github.com/itzelarrrr-alt/Invitaci-n-Evento/blob/main/2e39c3ed-0d98-430b-a9b8-8feef1db5e39.jpg?raw=true" alt="Foto 3">
            <img src="https://github.com/itzelarrrr-alt/Invitaci-n-Evento/blob/main/217b1ac8-8f2c-4200-8f00-9ee1740183a7.jpg?raw=true" alt="Foto 4">
            <img src="https://github.com/itzelarrrr-alt/Invitaci-n-Evento/blob/main/e7a3905b-8c21-4cc7-8d3f-562da5f13480.jpg?raw=true" alt="Foto 5">
        </div>
    </div>

    <script>
        const eventDate = new Date("September 27, 2026 10:15:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = eventDate - now;
            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
