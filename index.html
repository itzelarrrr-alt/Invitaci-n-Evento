<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Invitación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background-color: #fcfbf7; color: #333; text-align: center; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #8a6d3b; margin-bottom: 10px; font-size: 2.2em; }
    p { font-size: 1.1em; line-height: 1.6; margin-bottom: 15px; }
    
    /* Música */
    .audio-container { margin: 20px 0; }
    
    /* Contador */
    #countdown { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
    .time-block { background: #f4ede2; padding: 10px 15px; border-radius: 8px; min-width: 70px; }
    .time-block span { display: block; font-size: 1.8em; font-weight: bold; color: #8a6d3b; }
    .label { font-size: 0.8em; text-transform: uppercase; color: #666; }
    
    /* Galería */
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 25px 0; }
    .gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    
    /* Mapa */
    .map-container { margin-top: 25px; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 250px; border: 0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>¡Estás Invitado!</h1>
    <p>Acompáñanos a celebrar este momento tan especial.</p>
    
    <p><strong>Fecha:</strong> 27 de Septiembre<br>
    <strong>Hora:</strong> 12:00 PM<br>
    <strong>Lugar:</strong> Hotel La Plaza, Tequisquiapan, Qro.</p>

    <!-- Música de fondo -->
    <div class="audio-container">
      <p style="font-size:0.9em; color:#777;">Dale play para escuchar la música:</p>
      <audio controls autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      </audio>
    </div>

    <!-- Cuenta Regresiva -->
    <h2>Faltan:</h2>
    <div id="countdown">
      <div class="time-block"><span id="days">00</span><div class="label">Días</div></div>
      <div class="time-block"><span id="hours">00</span><div class="label">Horas</div></div>
      <div class="time-block"><span id="minutes">00</span><div class="label">Min</div></div>
      <div class="time-block"><span id="seconds">00</span><div class="label">Seg</div></div>
    </div>

    <!-- Galería de Fotos -->
    <h2>Galería</h2>
    <div class="gallery">
      <img src="https://picsum.photos/300/300?random=1" alt="Foto 1">
      <img src="https://picsum.photos/300/300?random=2" alt="Foto 2">
      <img src="https://picsum.photos/300/300?random=3" alt="Foto 3">
    </div>

    <!-- Mapa -->
    <h2>Ubicación</h2>
    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3735.6174836428453!2d-99.89437892398717!3d20.522928881000857!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d3744fc0cbbbb7%3A0x8bbbc6f40656a56c!2sHotel%20La%20Plaza!5e0!3m2!1ses-419!2smx!4v1700000000000!5m2!1ses-419!2smx" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    // Configura la fecha del evento (Año, Mes-1, Día, Hora, Minuto)
    // Nota: Los meses en JS van de 0 (Enero) a 11 (Diciembre), por eso Septiembre es 8.
    const eventDate = new Date(2026, 8, 27, 12, 0, 0).getTime();

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = eventDate - now;

      if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = "<h3>¡El evento ha comenzado!</h3>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days < 10 ? '0' + days : days;
      document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
    }, 1000);
  </script>

</body>
</html>
